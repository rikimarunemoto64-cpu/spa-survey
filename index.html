<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スパ調査ツール V4.2</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* --- ダークモード & スマホ最適化スタイル --- */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; 
            padding: 15px; 
            background-color: #121212; 
            color: #e0e0e0; 
            max-width: 600px; 
            margin: 0 auto; 
            padding-bottom: 80px;
        }
        
        h1 { font-size: 1.2rem; text-align: center; margin: 10px 0 20px; color: #90caf9; }
        h2 { font-size: 1rem; border-left: 4px solid #90caf9; padding-left: 10px; margin-top: 30px; color: #fff; }

        /* 仮説・テーマ入力欄 */
        .hypothesis-box {
            background: #1e1e1e; padding: 10px; border-radius: 8px; border: 1px solid #333; margin-bottom: 20px;
        }
        .hypothesis-box label { font-size: 0.8rem; color: #aaa; display: block; margin-bottom: 5px; }
        .hypothesis-box input {
            width: 95%; background: transparent; border: none; border-bottom: 1px solid #555; 
            color: #fff; font-size: 1rem; padding: 5px; outline: none;
        }

        /* 入力セクション */
        .section { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .label-title { font-size: 0.9rem; font-weight: bold; color: #bbb; margin-top: 10px; display: block; }

        /* ボタン群 */
        .btn-group { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; margin-top: 8px; }
        
        button.option-btn {
            padding: 15px 5px; 
            background: #2c2c2c; border: 1px solid #444; border-radius: 8px; 
            color: #ccc; cursor: pointer; font-size: 13px; font-weight: bold;
            transition: all 0.1s;
            touch-action: manipulation;
        }
        button.option-btn:active { transform: scale(0.96); }
        button.option-btn.active {
            background-color: #90caf9; color: #000; border-color: #90caf9;
        }

        /* 特別なボタン色 */
        #group-action button.option-btn.active { background-color: #ffcc80; color: #000; border-color: #ffcc80; }
        
        /* メモ入力欄 */
        .memo-area { margin-top: 15px; }
        .memo-area input {
            width: 100%; padding: 12px; background: #333; border: 1px solid #555; border-radius: 6px; 
            color: #fff; font-size: 16px; box-sizing: border-box;
        }
        .memo-area input::placeholder { color: #777; }

        /* 記録ボタン */
        #save-btn {
            width: 100%; padding: 18px; margin-top: 20px; border: none; border-radius: 10px;
            font-size: 18px; font-weight: bold; cursor: pointer; color: #000; 
            background: linear-gradient(135deg, #66bb6a, #43a047);
            box-shadow: 0 4px 10px rgba(67, 160, 71, 0.4);
        }
        #save-btn:active { transform: translateY(2px); box-shadow: none; }

        /* ログ表示 */
        #log-area { 
            max-height: 250px; overflow-y: auto; background: #1e1e1e; padding: 10px; 
            border-radius: 8px; font-size: 12px; border: 1px solid #333; margin-top: 10px; 
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #333; padding: 8px; text-align: left; color: #ccc; }
        .memo-text { color: #ffcc80; display: block; margin-top: 2px; font-size: 11px; }

        /* フッターボタン */
        .footer-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 30px; }
        .btn-row { display: flex; gap: 10px; }
        .sub-btn { flex: 1; padding: 14px; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; font-size: 14px;}
        
        /* グラフコンテナ */
        .chart-card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-top: 15px; }
    </style>
</head>
<body>

    <h1>🌙 スパ調査ツール V4.2</h1>

    <div class="hypothesis-box">
        <label>🎯 今日の調査テーマ（仮説）:</label>
        <input type="text" id="hypothesis-input" placeholder="例：ソロ客はどこで時間を潰す？" onchange="saveHypothesis()">
    </div>

    <div class="section">
        <label class="label-title">📍 ① 場所</label>
        <div class="btn-group" id="group-place">
            <button class="option-btn" onclick="select('place', '受付/ロビー', this)">受付/ロビー</button>
            <button class="option-btn" onclick="select('place', '休憩処', this)">休憩処</button>
            <button class="option-btn" onclick="select('place', '食事処', this)">食事処</button>
            <button class="option-btn" onclick="select('place', '自販機/通路', this)">自販機/通路</button>
            <button class="option-btn" onclick="select('place', 'ワーキング席', this)">ワーキング席</button>
        </div>

        <label class="label-title">👀 ② 状態・行動 <span style="font-size:10px; color:#ffcc80;">※重要</span></label>
        <div class="btn-group" id="group-action">
            <button class="option-btn" onclick="select('action', 'スマホ(暇/リラックス)', this)">スマホ(暇)</button>
            <button class="option-btn" onclick="select('action', 'スマホ(探索/困惑)', this)">スマホ(困)</button>
            <button class="option-btn" onclick="select('action', 'キョロキョロ(探索)', this)">探索・迷い</button>
            <button class="option-btn" onclick="select('action', '睡眠/リラックス', this)">睡眠/休憩</button>
            <button class="option-btn" onclick="select('action', '会話(団らん)', this)">会話</button>
            <button class="option-btn" onclick="select('action', '仕事/作業', this)">仕事/作業</button>
            <button class="option-btn" onclick="select('action', '諦め/帰宅', this)">諦め/帰宅</button>
        </div>

        <label class="label-title">👤 ③ 属性・グループ</label>
        <div class="btn-group">
            <button class="option-btn" onclick="select('group', '男性ソロ', this)">男性ソロ</button>
            <button class="option-btn" onclick="select('group', '女性ソロ', this)">女性ソロ</button>
            <button class="option-btn" onclick="select('group', '男性グループ', this)">男性G</button>
            <button class="option-btn" onclick="select('group', '女性グループ', this)">女性G</button>
            <button class="option-btn" onclick="select('group', 'カップル', this)">カップル</button>
            <button class="option-btn" onclick="select('group', '家族連れ', this)">家族</button>
            <button class="option-btn" onclick="select('group', 'シニア男性', this)">シニア男性</button>
            <button class="option-btn" onclick="select('group', 'シニア女性', this)">シニア女性</button>
            <button class="option-btn" onclick="select('group', 'シニア夫婦/G', this)">シニア夫婦/G</button>
        </div>

        <div class="memo-area">
            <input type="text" id="memo-input" placeholder="📝 気づきメモ (例: コンセント探してた)">
        </div>

        <button id="save-btn" onclick="saveData()">記録する</button>
    </div>

    <h2>📊 現場分析 (Realtime)</h2>
    <div class="chart-card">
        <canvas id="chart-action"></canvas>
    </div>
    
    <h2>📝 ログ (最新10件)</h2>
    <div id="log-area">
        <p>合計: <span id="total-count">0</span> 件</p>
        <table>
            <thead><tr><th>時間</th><th>属性</th><th>場所/行動/メモ</th></tr></thead>
            <tbody id="log-table-body"></tbody>
        </table>
    </div>

    <div class="footer-btns">
        <button class="sub-btn" style="background:#06c755; font-size:16px;" onclick="copyToClipboard()">📋 データをコピー (LINE送信などに)</button>
        
        <div class="btn-row">
            <button class="sub-btn" style="background:#555;" onclick="downloadCSV()">📥 CSV保存</button>
            <button class="sub-btn" style="background:#d32f2f;" onclick="clearData()">🗑 全消去</button>
        </div>
    </div>

    <script>
        Chart.defaults.color = '#e0e0e0';
        Chart.defaults.borderColor = '#444';

        let current = { place: '', action: '', group: '' };
        // V4と同じキーを使うことで、前回のデータを引き継ぎます
        let records = JSON.parse(localStorage.getItem('spaSurveyV4')) || [];
        let hypothesis = localStorage.getItem('spaHypothesis') || '';
        let myChart = null;

        document.getElementById('hypothesis-input').value = hypothesis;
        updateUI();

        function select(category, value, btn) {
            current[category] = value;
            const groupDiv = btn.parentElement;
            for(let b of groupDiv.children) b.classList.remove('active');
            btn.classList.add('active');
        }

        function saveHypothesis() {
            const val = document.getElementById('hypothesis-input').value;
            localStorage.setItem('spaHypothesis', val);
        }

        function saveData() {
            const memo = document.getElementById('memo-input').value;
            
            if(!current.place || !current.action || !current.group) {
                alert("場所・行動・属性をすべて選択してください");
                return;
            }

            const now = new Date();
            const timeStr = now.getHours() + ":" + String(now.getMinutes()).padStart(2, '0');

            const newRecord = {
                id: Date.now(),
                timestamp: now.toISOString(),
                timeStr: timeStr,
                place: current.place,
                action: current.action,
                group: current.group,
                memo: memo
            };

            records.push(newRecord);
            localStorage.setItem('spaSurveyV4', JSON.stringify(records));

            resetForm();
            updateUI();
        }

        function resetForm() {
            current = { place: '', action: '', group: '' };
            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('memo-input').value = '';
        }

        function updateUI() {
            const tbody = document.getElementById('log-table-body');
            tbody.innerHTML = '';
            document.getElementById('total-count').innerText = records.length;
            
            [...records].reverse().forEach(r => {
                const memoHtml = r.memo ? `<br><span class="memo-text">📝 ${r.memo}</span>` : '';
                tbody.innerHTML += `<tr>
                    <td>${r.timeStr}</td>
                    <td>${r.group}</td>
                    <td>
                        <span style="color:#90caf9">${r.place}</span><br>
                        <span style="color:#ffcc80; font-weight:bold;">${r.action}</span>
                        ${memoHtml}
                    </td>
                </tr>`;
            });

            updateChart();
        }

        function updateChart() {
            if (records.length === 0) return;
            const counts = {};
            records.forEach(r => { counts[r.action] = (counts[r.action] || 0) + 1; });
            const ctx = document.getElementById('chart-action').getContext('2d');
            if (myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(counts),
                    datasets: [{
                        label: '行動・状態の件数',
                        data: Object.values(counts),
                        backgroundColor: '#ffcc80',
                        borderWidth: 0
                    }]
                },
                options: { responsive: true, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
            });
        }

        // ▼▼▼ 新機能：テキストコピー機能 ▼▼▼
        function copyToClipboard() {
            if(records.length === 0) {
                alert("データがまだありません。記録してから押してください。");
                return;
            }

            const currentHypothesis = document.getElementById('hypothesis-input').value;
            let text = `【スパ調査レポート】\n仮説テーマ: ${currentHypothesis}\n\n`;

            records.forEach(r => {
                // 日付を見やすく整形
                const dt = new Date(r.timestamp);
                const dateStr = `${dt.getMonth()+1}/${dt.getDate()}`;
                const memoStr = r.memo ? ` (📝${r.memo})` : "";
                
                // LINEで見やすい形式に変換
                text += `● ${dateStr} ${r.timeStr}\n`;
                text += `　${r.place} / ${r.group} / ${r.action}${memoStr}\n`;
            });

            // クリップボードにコピー
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => {
                    alert("✅ コピーしました！\n\nLINEやメモ帳を開いて「貼り付け」してください。");
                }).catch(err => {
                    alert("コピーに失敗しました。");
                });
            } else {
                alert("このブラウザでは対応していません。");
            }
        }
        // ▲▲▲▲▲▲

        function downloadCSV() {
            if(records.length === 0) return alert("データがありません");
            let csv = "\uFEFF日時,場所,属性,行動・状態,メモ,その時の仮説テーマ\n";
            const currentHypothesis = document.getElementById('hypothesis-input').value;
            records.forEach(r => {
                const cleanMemo = (r.memo || "").replace(/,/g, "、");
                const dt = new Date(r.timestamp);
                const dateStr = `${dt.getFullYear()}/${dt.getMonth()+1}/${dt.getDate()} ${dt.getHours()}:${dt.getMinutes()}`;
                csv += `${dateStr},${r.place},${r.group},${r.action},${cleanMemo},${currentHypothesis}\n`;
            });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
            link.download = "spa_insight_survey.csv";
            link.click();
        }

        function clearData() {
            if(confirm("全データを消去しますか？")) {
                records = [];
                localStorage.removeItem('spaSurveyV4');
                updateUI();
            }
        }
    </script>
</body>
</html>
