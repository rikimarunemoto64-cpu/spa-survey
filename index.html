<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スパ行動観察・新サービス検討用ツール</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: "Helvetica Neue", Arial, sans-serif; padding: 20px; background-color: #f4f6f9; color: #333; max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; font-size: 1.4rem; margin-bottom: 20px; }
        h2 { border-left: 6px solid #3498db; padding-left: 10px; margin-top: 40px; color: #2c3e50; }

        /* 入力エリア */
        .input-panel { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .label-title { font-weight: bold; font-size: 0.95rem; color: #555; margin-top: 15px; display: block; }
        
        .btn-group { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; margin-top: 5px; }
        
        button.option-btn {
            padding: 10px; border: 1px solid #e0e0e0; background: #fff; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.2s; color: #555;
        }
        button.option-btn:hover { background: #f8f9fa; }
        button.option-btn.active {
            background-color: #3498db; color: white; border-color: #3498db; font-weight: bold; box-shadow: 0 2px 4px rgba(52, 152, 219, 0.3);
        }

        /* 特別な色分け（行動・場所） */
        #group-action button.option-btn.active { background-color: #e67e22; border-color: #e67e22; }
        #group-place button.option-btn.active { background-color: #27ae60; border-color: #27ae60; }

        /* 人数入力 */
        .number-input-wrapper { display: flex; align-items: center; gap: 10px; margin-top: 8px; background: #f8f9fa; padding: 8px 12px; border-radius: 6px; width: fit-content; }
        input[type="number"] { width: 50px; padding: 5px; text-align: center; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }

        /* 記録ボタン */
        #save-btn { width: 100%; padding: 16px; margin-top: 25px; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; color: white; background-color: #2c3e50; transition: transform 0.1s; }
        #save-btn:active { transform: scale(0.98); }

        /* グラフエリア */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .chart-card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .chart-title { font-size: 0.9rem; font-weight: bold; color: #7f8c8d; margin-bottom: 10px; text-align: center; }

        /* ログエリア */
        #log-area { max-height: 250px; overflow-y: auto; background: white; padding: 10px; border-radius: 8px; font-size: 12px; margin-top: 10px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #f1f1f1; padding: 8px; text-align: left; }
        th { color: #888; font-weight: normal; }

        /* フッターボタン */
        .footer-btns { display: flex; gap: 10px; margin-top: 30px; margin-bottom: 50px; }
        .sub-btn { flex: 1; padding: 12px; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <h1>🔍 スパ新サービス開発用 調査ツール</h1>

    <div class="input-panel">
        <p style="margin:0; font-size:12px; color:#888;">観察対象を見てボタンを押してください</p>

        <label class="label-title">📍 ① どこにいる？（場所）</label>
        <div class="btn-group" id="group-place">
            <button class="option-btn" onclick="select('place', '受付/ロビー', this)">受付/ロビー</button>
            <button class="option-btn" onclick="select('place', '休憩スペース', this)">休憩スペース</button>
            <button class="option-btn" onclick="select('place', '食事処', this)">食事処</button>
            <button class="option-btn" onclick="select('place', '脱衣所入口付近', this)">脱衣所入口</button>
            <button class="option-btn" onclick="select('place', 'ワーキングエリア', this)">ワーキング席</button>
        </div>

        <label class="label-title">👀 ② 何をしている？（行動）<span style="color:#e74c3c; font-size:11px;"> ※最も重要なデータ</span></label>
        <div class="btn-group" id="group-action">
            <button class="option-btn" onclick="select('action', 'スマホ操作', this)">スマホ操作</button>
            <button class="option-btn" onclick="select('action', '会話/団らん', this)">会話/団らん</button>
            <button class="option-btn" onclick="select('action', '睡眠/リラックス', this)">睡眠/休憩</button>
            <button class="option-btn" onclick="select('action', '食事/飲酒', this)">食事/飲酒</button>
            <button class="option-btn" onclick="select('action', 'PC仕事/読書', this)">PC仕事/読書</button>
            <button class="option-btn" onclick="select('action', '待ち/手持ち無沙汰', this)">待ち/暇そう</button>
        </div>

        <label class="label-title">👤 ③ 誰が？（属性）</label>
        <div class="btn-group">
            <button class="option-btn" onclick="select('ageGender', '男性 20-30', this)">男性 20-30</button>
            <button class="option-btn" onclick="select('ageGender', '男性 40+', this)">男性 40+</button>
            <button class="option-btn" onclick="select('ageGender', '女性 20-30', this)">女性 20-30</button>
            <button class="option-btn" onclick="select('ageGender', '女性 40+', this)">女性 40+</button>
        </div>

        <label class="label-title">👥 ④ グループと人数</label>
        <div class="btn-group">
            <button class="option-btn" onclick="select('groupType', 'お一人', this)">お一人</button>
            <button class="option-btn" onclick="select('groupType', '友人/カップル', this)">友人/カップル</button>
            <button class="option-btn" onclick="select('groupType', '家族連れ', this)">家族連れ</button>
        </div>
        <div class="number-input-wrapper">
            <span>人数:</span>
            <input type="number" id="group-size-input" value="1" min="1">
            <span>名</span>
        </div>

        <button id="save-btn" onclick="saveData()">記録する</button>
    </div>

    <h2>📊 現場分析ダッシュボード</h2>
    <div class="dashboard-grid">
        <div class="chart-card">
            <div class="chart-title">お客さんは何をしているか？（ニーズの種）</div>
            <canvas id="chart-action"></canvas>
            <p style="font-size:11px; color:#666; padding:10px;">ヒント: 「スマホ」が多いならアプリ連携？「仕事」が多いならコワーキング強化？</p>
        </div>
        
        <div class="chart-card">
            <div class="chart-title">どこが混んでいるか？（ボトルネック）</div>
            <canvas id="chart-place"></canvas>
        </div>

        <div class="chart-card">
            <div class="chart-title">主なターゲット層</div>
            <canvas id="chart-demog"></canvas>
        </div>
    </div>

    <h2>📝 記録ログ</h2>
    <div id="log-area">
        <p>合計観察数: <span id="total-count">0</span> 組</p>
        <table>
            <thead><tr><th>時間</th><th>場所</th><th>行動</th><th>属性(人数)</th></tr></thead>
            <tbody id="log-table-body"></tbody>
        </table>
    </div>

    <div class="footer-btns">
        <button class="sub-btn" style="background:#27ae60;" onclick="downloadCSV()">Excel(CSV)保存</button>
        <button class="sub-btn" style="background:#c0392b;" onclick="clearData()">全データ消去</button>
    </div>

    <script>
        // データ管理
        let current = { place: '', action: '', ageGender: '', groupType: '' };
        let records = JSON.parse(localStorage.getItem('spaSurveyV3')) || [];
        let charts = {};

        // 初期化
        updateUI();

        function select(category, value, btn) {
            current[category] = value;
            // ボタンの見た目更新
            const group = btn.parentElement;
            for(let b of group.children) b.classList.remove('active');
            btn.classList.add('active');

            // 人数自動入力
            if(category === 'groupType') {
                const numInput = document.getElementById('group-size-input');
                if(value === 'お一人') numInput.value = 1;
                else if(value === '友人/カップル' && numInput.value == 1) numInput.value = 2;
            }
        }

        function saveData() {
            const size = document.getElementById('group-size-input').value;
            if(!current.place || !current.action || !current.ageGender || !current.groupType) {
                alert("全ての項目（場所・行動・属性・グループ）を選択してください");
                return;
            }

            const now = new Date();
            records.push({
                id: Date.now(),
                timeStr: now.getHours() + ":" + String(now.getMinutes()).padStart(2, '0'),
                place: current.place,
                action: current.action,
                ageGender: current.ageGender,
                groupType: current.groupType,
                size: parseInt(size)
            });

            localStorage.setItem('spaSurveyV3', JSON.stringify(records));
            resetForm();
            updateUI();
        }

        function resetForm() {
            current = { place: '', action: '', ageGender: '', groupType: '' };
            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('group-size-input').value = 1;
        }

        function updateUI() {
            // ログ更新
            const tbody = document.getElementById('log-table-body');
            tbody.innerHTML = '';
            document.getElementById('total-count').innerText = records.length;
            
            [...records].reverse().forEach(r => {
                tbody.innerHTML += `<tr>
                    <td>${r.timeStr}</td>
                    <td>${r.place}</td>
                    <td style="color:#e67e22; font-weight:bold;">${r.action}</td>
                    <td>${r.ageGender}<br><small>${r.groupType}(${r.size})</small></td>
                </tr>`;
            });

            updateCharts();
        }

        // グラフ描画
        function updateCharts() {
            if(records.length === 0) return;

            const countBy = (key) => {
                const counts = {};
                records.forEach(r => counts[r[key]] = (counts[r[key]] || 0) + 1);
                return counts;
            };

            drawChart('chart-action', 'bar', countBy('action'), '#e67e22');
            drawChart('chart-place', 'bar', countBy('place'), '#27ae60');
            drawChart('chart-demog', 'doughnut', countBy('ageGender'), ['#3498db', '#2980b9', '#e74c3c', '#c0392b']);
        }

        function drawChart(canvasId, type, dataObj, colors) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            if(charts[canvasId]) charts[canvasId].destroy();

            charts[canvasId] = new Chart(ctx, {
                type: type,
                data: {
                    labels: Object.keys(dataObj),
                    datasets: [{
                        label: '件数',
                        data: Object.values(dataObj),
                        backgroundColor: colors,
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: type === 'doughnut' } },
                    scales: type === 'bar' ? { y: { beginAtZero: true, ticks: { stepSize: 1 } } } : {}
                }
            });
        }

        function downloadCSV() {
            if(records.length === 0) return alert("データがありません");
            let csv = "\uFEFF時間,場所,行動,属性,グループ,人数\n";
            records.forEach(r => {
                csv += `${r.timeStr},${r.place},${r.action},${r.ageGender},${r.groupType},${r.size}\n`;
            });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
            link.download = "spa_service_research.csv";
            link.click();
        }

        function clearData() {
            if(confirm("全データを消去しますか？")) {
                records = [];
                localStorage.removeItem('spaSurveyV3');
                updateUI();
            }
        }
    </script>
</body>
</html>
